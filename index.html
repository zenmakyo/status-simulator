<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<title>ステータスシミュレータ｜全魔協（げんもの）</title>
<link rel="stylesheet" href="style.css">

<meta name="description" content="変化後や転生後のステータスをシミュレートできます。">
<meta name="robots" content="index,follow">

<link rel="canonical" href="https://zenmakyo.github.io/status-simulator/">
<meta property="og:site_name" content="全魔協（げんもの）">
<meta property="og:title" content="ステシミュ｜全魔協（げんもの）">
<meta property="og:description" content="変化後や転生後のステータスをシミュレートできます">
<meta property="og:url" content="https://zenmakyo.github.io/status-simulator/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ja_JP">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="ステシミュ｜全魔協（げんもの）">
<meta name="twitter:description" content="ステータスシミュレータ｜全魔協（げんもの）">

<link rel="icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&display=swap" rel="stylesheet">
<script type="application/ld+json">
{
 "@context": "https://schema.org",
 "@type": "WebSite",
 "name": "全魔協（げんもの）",
 "url": "https://zenmakyo.github.io/status-simulator/"
}
</script>
</head>

<body>

<!-- ホームへ戻るロゴボタン -->
<a href="https://zenmakyo.github.io/genmono2/" class="site-logo" aria-label="ホームへ戻る">
    <img src="site-logo.png" alt="ぜんま・全魔協">
</a>
 
  <h1>育成予測計算</h1>

<div class="box-master">
  <table class="genju">
   <tr>
    <td class="genju-ex">幻獣名</td>
    <td class="genju-name" id="genjuName">さなぎ</td>
    <td class="genju-re">
     <div id="rebirthCount" style="font-size: 18px;">0</div>
     <div style="font-size: 8px;">転目</div>
    </td>
   </tr>
  </table>
  <table class="genju-item">
   <tr>
    <td class="genju-ex">変化名</td>
    <td class="item-name" id="changeName">幻獣の繭</td>
   </tr>
  </table>
  <table class="genju-status">
   <tr>
    <td class="genju-ex">幻獣Lv</td>
    <td class="genju-display" style="font-weight: bold; font-size: 18px;" id="genjuLevel">1</td>
    <td class="genju-ex" id="genjuPoint">Status Point</td>
    <td class="genju-sp" id="remainingPoint">0</td>
   </tr>
   <tr>
    <td class="genju-ex">上限Lv</td>
    <td class="genju-display" id="maxLevel">200</td>
    <td class="genju-ex" style="background-color: #a8d387;">Stamina</td>
    <td style="border-bottom: 1px solid #d4acad;">
     <div class="genju-value" id="statusS">70</div>
     <div class="genju-point">(<span id="pointS">5</span>pt )</div>
    </td>
   </tr>
   <tr>
    <td class="genju-ex">Class</td>
    <td class="genju-display" id="genjuClass">F</td>
    <td class="genju-ex" style="background-color: #f59195;">Attack</td>
    <td style="border-bottom: 1px solid #d4acad;">
     <div class="genju-value" id="statusA">20</div>
     <div class="genju-point">(<span id="pointA">5</span>pt )</div>
    </td>
   </tr>
   <tr>
    <td class="genju-ex">属性</td>
    <td class="genju-display" id="attribute">無</td>
    <td class="genju-ex" style="background-color: #7abade;">Defence</td>
    <td style="border-bottom: 1px solid #d4acad;">
     <div class="genju-value" id="statusD">22</div>
     <div class="genju-point">(<span id="pointD">5</span>pt)</div>
    </td>
   </tr>
  </table>
  <table class="genju-output">
   <tr>
    <td class="output">
      <div class="history-buttons">
      <button type="button" id="historyBack" disabled>↩ 戻る</button>
      <button type="button" id="historyForward" disabled>↪ 進む</button>
      </div>
    </td>
    <td class="genju-ex" style="border-bottom: none; background-color: #f1ad7a;">Luck</td>
    <td>
     <div class="genju-value" id="statusL">5</div>
     <div class="genju-point">(<span id="pointL">5</span>pt)</div>
    </td>
   </tr>
  </table>
</div>

<!-- ステータス読み込み -->
<div class="box-master">
    <table class="history-box status-load-box" id="statusLoadBox">
        <tr>
            <td class="history-title">
                <button
                    type="button"
                    id="statusLoadToggle"
                    class="history-toggle"
                    aria-expanded="false"
                    aria-controls="statusLoadContentRow"
                >
                    <span class="history-toggle-text">ステータス読み込み</span>
                    <span
                        id="statusLoadToggleIcon"
                        class="history-toggle-icon"
                    >▼</span>
                </button>
            </td>
        </tr>

        <tr id="statusLoadContentRow" hidden>
            <td class="history-content status-load-content">
                <div class="status-load-form">

                    <!-- 幻獣名 -->
                    <div class="status-load-field">
                        <span class="status-load-label">幻獣名</span>

                        <div class="status-load-genju-wrapper">

                            <!-- 入力欄と×ボタンをまとめる -->
                            <div class="status-load-genju-input-wrapper">
                                <input
                                    type="text"
                                    id="statusLoadGenju"
                                    autocomplete="off"
                                    aria-autocomplete="list"
                                    aria-controls="statusLoadGenjuList"
                                    placeholder="幻獣名を入力"
                                >

                                <button
                                    type="button"
                                    id="statusLoadGenjuClear"
                                    class="status-load-genju-clear"
                                    aria-label="幻獣名をクリア"
                                    hidden
                                >×</button>
                            </div>

                            <!-- 候補リストは入力欄と同じ親要素に置く -->
                            <div
                                id="statusLoadGenjuList"
                                class="status-load-genju-list"
                                role="listbox"
                                hidden
                            ></div>

                        </div>
                    </div>

                    <!-- レベル -->
                    <div class="status-load-field">
                        <span class="status-load-label">Level</span>
                        <div class="status-load-input-unit">
                            <input
                                type="number"
                                id="statusLoadLevel"
                                min="1"
                                step="1"
                                inputmode="numeric"
                            >
                        </div>
                    </div>

                    <!-- 転生数 -->
                    <div class="status-load-field">
                        <span class="status-load-label">転生数</span>
                        <div class="status-load-input-unit">
                            <input
                                type="number"
                                id="statusLoadRebirth"
                                min="0"
                                step="1"
                                inputmode="numeric"
                            >
                            <span class="status-load-unit">転生</span>
                        </div>
                    </div>

                    <!-- 残り割り振りポイント -->
                    <div class="status-load-field">
                        <span class="status-load-label">Status Point</span>
                        <div class="status-load-input-unit">
                            <input
                                type="number"
                                id="statusLoadPoint"
                                min="0"
                                step="1"
                                inputmode="numeric"
                            >
                            <span class="status-load-unit">pt</span>
                        </div>
                    </div>

                    <!-- 各ステータスポイント -->
                    <div class="status-load-statuses">

                        <div class="status-load-field">
                            <span class="status-load-label">Stamina</span>
                            <div class="status-load-input-unit">
                                <input
                                    type="number"
                                    id="statusLoadStamina"
                                    min="0"
                                    step="1"
                                    inputmode="numeric"
                                >
                                <span class="status-load-unit">pt</span>
                            </div>
                        </div>

                        <div class="status-load-field">
                            <span class="status-load-label">Attack</span>
                            <div class="status-load-input-unit">
                                <input
                                    type="number"
                                    id="statusLoadAttack"
                                    min="0"
                                    step="1"
                                    inputmode="numeric"
                                >
                                <span class="status-load-unit">pt</span>
                            </div>
                        </div>

                        <div class="status-load-field">
                            <span class="status-load-label">Defence</span>
                            <div class="status-load-input-unit">
                                <input
                                    type="number"
                                    id="statusLoadDefence"
                                    min="0"
                                    step="1"
                                    inputmode="numeric"
                                >
                                <span class="status-load-unit">pt</span>
                            </div>
                        </div>

                        <div class="status-load-field">
                            <span class="status-load-label">Luck</span>
                            <div class="status-load-input-unit">
                                <input
                                    type="number"
                                    id="statusLoadLuck"
                                    min="0"
                                    step="1"
                                    inputmode="numeric"
                                >
                                <span class="status-load-unit">pt</span>
                            </div>
                        </div>

                    </div>

                    <!-- 読み込むボタン -->
                    <button
                        type="button"
                        id="statusLoadButton"
                        class="status-load-button"
                    >
                        読み込む
                    </button>

                </div>
            </td>
        </tr>
    </table>
</div>

<div class="box-master">
 <table class="change-box">
  <tr>
   <td class="change-title">変化先</td>
  </tr>
  <tr>
   <td class="change-genju" id="changeGenju"></td>
  </tr>
 </table>
</div>

<div class="box-master">
 <table class="number-table">
  <tr>
   <td class="number-ex">Lv.</td>
   <td class="number-btn"><button class="num-btn">-100</button></td>
   <td class="number-btn"><button class="num-btn">-10</button></td>
   <td class="number-btn"><button class="num-btn">-1</button></td>
   <td class="number-btn"><button class="num-btn">+1</button></td>
   <td class="number-btn"><button class="num-btn">+10</button></td>
   <td class="number-btn"><button class="num-btn">+100</button></td>
  </tr>
 </table>
</div>

<div class="box-master">
 <table class="number-table">
  <tr>
   <td class="number-ex">S pt</td>
   <td class="number-btn"><button class="num-btn">-100</button></td>
   <td class="number-btn"><button class="num-btn">-10</button></td>
   <td class="number-btn"><button class="num-btn">-1</button></td>
   <td class="number-btn"><button class="num-btn">+1</button></td>
   <td class="number-btn"><button class="num-btn">+10</button></td>
   <td class="number-btn"><button class="num-btn">+100</button></td>
  </tr>
 </table>
</div>

<div class="box-master">
 <table class="number-table">
  <tr>
   <td class="number-ex">A pt</td>
   <td class="number-btn"><button class="num-btn">-100</button></td>
   <td class="number-btn"><button class="num-btn">-10</button></td>
   <td class="number-btn"><button class="num-btn">-1</button></td>
   <td class="number-btn"><button class="num-btn">+1</button></td>
   <td class="number-btn"><button class="num-btn">+10</button></td>
   <td class="number-btn"><button class="num-btn">+100</button></td>
  </tr>
 </table>
</div>

<div class="box-master">
 <table class="number-table">
  <tr>
   <td class="number-ex">D pt</td>
   <td class="number-btn"><button class="num-btn">-100</button></td>
   <td class="number-btn"><button class="num-btn">-10</button></td>
   <td class="number-btn"><button class="num-btn">-1</button></td>
   <td class="number-btn"><button class="num-btn">+1</button></td>
   <td class="number-btn"><button class="num-btn">+10</button></td>
   <td class="number-btn"><button class="num-btn">+100</button></td>
  </tr>
 </table>
</div>

<div class="box-master">
 <table class="number-table">
  <tr>
   <td class="number-ex">L pt</td>
   <td class="number-btn"><button class="num-btn">-100</button></td>
   <td class="number-btn"><button class="num-btn">-10</button></td>
   <td class="number-btn"><button class="num-btn">-1</button></td>
   <td class="number-btn"><button class="num-btn">+1</button></td>
   <td class="number-btn"><button class="num-btn">+10</button></td>
   <td class="number-btn"><button class="num-btn">+100</button></td>
  </tr>
 </table>
</div>

<!-- ==============================
     変化履歴
     ============================== -->

<div class="box-master">
    <table class="history-box" id="historyBox">
        <tr>
            <td class="history-title">
                <button
                    type="button"
                    id="historyToggle"
                    class="history-toggle"
                    aria-expanded="false"
                    aria-controls="historyContent"
                >
                    <span class="history-toggle-text">変化履歴</span>
                    <span id="historyToggleIcon" class="history-toggle-icon">▼</span>
                </button>
            </td>
        </tr>
        <tr id="historyContentRow" hidden>
            <td class="history-content" id="historyContent">
                <!-- 変化履歴をあとから表示する -->
            </td>
        </tr>
    </table>
</div>

<!-- 変化履歴の操作ボタン -->
<div class="history-action-buttons">
    <button type="button" id="historySaveButton">
        リストに保存
    </button>

    <button type="button" id="historyLoadButton">
        リストから呼出
    </button>

    <button type="button" id="historyExportButton">
        履歴の出力
    </button>
</div>

<!-- 育成状態の保存モーダル -->
<div id="saveStateDialog" class="save-state-overlay" hidden>
    <div
        class="save-state-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="saveStateTitle"
    >
        <!-- 保存名 -->
        <div class="save-state-header">
            <label id="saveStateTitle" for="saveStateName">
                保存名
            </label>

            <input
                type="text"
                id="saveStateName"
                maxlength="50"
                placeholder="未入力の場合は自動命名"
            >
        </div>

        <!-- 保存スロット一覧 -->
        <div class="save-state-list-section">
            <h3 class="save-state-list-title">リスト一覧</h3>

            <div id="saveStateList" class="save-state-list">
                <!-- saveLoad.jsで30個のスロットを自動生成 -->
            </div>
        </div>

        <!-- 下部エリア -->
        <div class="save-state-footer">
            <p
                id="saveStateMessage"
                role="status"
                aria-live="polite"
            ></p>

            <button type="button" id="saveStateCancel">
                キャンセル
            </button>
        </div>
    </div>
</div>

<!-- 育成状態の呼び出しモーダル -->
<div id="loadStateDialog" class="save-state-overlay" hidden>
    <div
        class="save-state-modal load-state-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loadStateTitle"
    >
        <!-- 上部タイトル -->
        <div class="load-state-header">
            <h2 id="loadStateTitle">リストから呼出</h2>
        </div>

        <!-- 保存スロット一覧 -->
        <div class="save-state-list-section load-state-list-section">

            <div id="loadStateList" class="save-state-list">
                <!-- JavaScriptで30個のスロットを生成する予定 -->
            </div>
        </div>

        <!-- 下部エリア -->
        <div class="save-state-footer">
            <p
                id="loadStateMessage"
                role="status"
                aria-live="polite"
            ></p>

            <button type="button" id="loadStateCancel">
                キャンセル
            </button>
        </div>
    </div>
</div>

<div style="font-size: 12px; text-align:center; background-color: aliceblue; padding: 10px; margin-top: 20px;">
#全日本魔水晶のかけらを救いたい協会
</div>

<script src="genjuData.js"></script>
<script src="script.js"></script>
<script src="saveLoad.js"></script>
<script sec="routeImage.js"></script>
 
</body>
</html>
